name: Release

# Pushing a tag v* publishes eleph-codegen's binaries to that tag's GitHub Release.
# Creating the tag is the owner's decision; see docs/RELEASING.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  eleph-codegen:
    uses: ./.github/workflows/release-binary.yml
    with:
      binary: eleph-codegen
